[project]
name = "openneuro-mcp"
version = "0.1.1"
description = "MCP server for OpenNeuro: search, archive census, participant-level metadata, files and downloads."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Luna Pérez Troncoso" }]
keywords = ["mcp", "openneuro", "bids", "neuroimaging", "eeg", "meg", "fmri", "neuroscience"]
dependencies = [
  "mcp>=1.10",
  "httpx>=0.27",
  "pydantic>=2.7",
  "graphql-core>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
openneuro-mcp = "openneuro_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openneuro_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: needs network access to raw.githubusercontent.com"]
